<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Inicio de Sesión - Windows 11</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        /* Overlay Acrylic / Glassmorphism background */
        .backdrop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(25px) brightness(0.85);
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* Barra de Referencia Superior */
        .reference-bar {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 900px;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            gap: 15px;
        }

        .ref-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            flex: 1;
        }

        .ref-field {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ref-field label {
            font-size: 0.85rem;
            color: #a0c4ff;
            font-weight: 600;
        }

        .ref-field input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
            width: 140px;
        }

        .ref-field input:disabled {
            color: #e0e1dd;
        }

        .ref-actions {
            display: flex;
            gap: 10px;
        }

        .btn-ref {
            background: #0078d4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-ref:hover {
            background: #106ebe;
        }

        /* Contenedor Principal (Windows 11 Lock Screen) */
        .main-container {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Reloj Superior */
        .clock-container {
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .clock-time {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .clock-date {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Tarjeta Login */
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px 40px;
            border-radius: 16px;
            width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0078d4, #00b7c3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .user-display-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .input-control {
            width: 100%;
            padding: 12px 40px 12px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 2px solid #0078d4;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-control:focus {
            background: rgba(0, 0, 0, 0.6);
            border-bottom-color: #60a5fa;
            box-shadow: 0 0 10px rgba(0, 120, 212, 0.5);
        }

        .input-control::placeholder {
            color: #a0a0a0;
        }

        .btn-submit {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #0078d4;
        }

        .toggle-password {
            position: absolute;
            right: 42px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #a0a0a0;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        /* Marcador de Planas / Éxitos */
        .counter-badge {
            margin-top: 15px;
            background: rgba(40, 167, 69, 0.25);
            border: 1px solid rgba(40, 167, 69, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #d4edda;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Mensajes de Feedback */
        .feedback-message {
            margin-top: 10px;
            font-size: 0.88rem;
            min-height: 22px;
            text-align: center;
            font-weight: 500;
        }

        .feedback-success {
            color: #4ade80;
        }

        .feedback-error {
            color: #f87171;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="backdrop-overlay"></div>

    <!-- Barra de Referencia Superior -->
    <div class="reference-bar">
        <div class="ref-info">
            <div class="ref-field">
                <label>👤 Usuario Modelo:</label>
                <input type="text" id="refUser" value="estudiante4" disabled>
            </div>
            <div class="ref-field">
                <label>🔑 Contraseña Modelo:</label>
                <input type="password" id="refPass" value="12345" disabled>
            </div>
        </div>
        <div class="ref-actions">
            <button class="btn-ref" id="btnToggleVisibility" onclick="toggleRefVisibility()">👁️ Mostrar Clave</button>
            <button class="btn-ref" id="btnEdit" onclick="toggleEditMode()">🔒 Cambiar Datos</button>
        </div>
    </div>

    <!-- Pantalla Principal -->
    <div class="main-container">
        <div class="clock-container">
            <div class="clock-time" id="clockTime">10:00 AM</div>
            <div class="clock-date" id="clockDate">Práctica de Inicio de Sesión</div>
        </div>

        <div class="login-card">
            <div class="avatar-container">👤</div>
            <div class="user-display-name" id="displayUserName">estudiante4</div>

            <!-- Campo Usuario -->
            <div class="input-group">
                <input type="text" class="input-control" id="inputUser" placeholder="Nombre de usuario" autocomplete="off">
            </div>

            <!-- Campo Contraseña -->
            <div class="input-group">
                <input type="password" class="input-control" id="inputPass" placeholder="Contraseña" autocomplete="off">
                <button class="toggle-password" onclick="togglePracticePass()">👁️</button>
                <button class="btn-submit" onclick="validateLogin()" title="Iniciar sesión">➔</button>
            </div>

            <div class="feedback-message" id="feedback"></div>

            <div class="counter-badge">
                ✍️ Planas completadas: <span id="counter">0</span>
            </div>
        </div>
    </div>

    <script>
        let isEditing = false;
        let count = 0;

        // Actualizar reloj de pantalla
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockTime').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Habilitar / Deshabilitar edición de datos de referencia
        function toggleEditMode() {
            const refUser = document.getElementById('refUser');
            const refPass = document.getElementById('refPass');
            const btnEdit = document.getElementById('btnEdit');

            isEditing = !isEditing;

            if (isEditing) {
                refUser.disabled = false;
                refPass.disabled = false;
                refPass.type = "text";
                btnEdit.textContent = "🔓 Guardar / Bloquear";
                btnEdit.style.background = "#28a745";
            } else {
                refUser.disabled = true;
                refPass.disabled = true;
                refPass.type = "password";
                btnEdit.textContent = "🔒 Cambiar Datos";
                btnEdit.style.background = "#0078d4";
                document.getElementById('btnToggleVisibility').textContent = "👁️ Mostrar Clave";
                document.getElementById('displayUserName').textContent = refUser.value || "estudiante4";
                
                // Reiniciar contador al cambiar datos de referencia
                count = 0;
                document.getElementById('counter').textContent = count;
            }
        }

        // Mostrar / Ocultar clave de referencia
        function toggleRefVisibility() {
            if (isEditing) return;
            const refPass = document.getElementById('refPass');
            const btn = document.getElementById('btnToggleVisibility');
            if (refPass.type === "password") {
                refPass.type = "text";
                btn.textContent = "🙈 Ocultar Clave";
            } else {
                refPass.type = "password";
                btn.textContent = "👁️ Mostrar Clave";
            }
        }

        // Mostrar / Ocultar clave de práctica
        function togglePracticePass() {
            const inputPass = document.getElementById('inputPass');
            inputPass.type = inputPass.type === "password" ? "text" : "password";
        }

        // Validar inicio de sesión
        function validateLogin() {
            const refUser = document.getElementById('refUser').value.trim();
            const refPass = document.getElementById('refPass').value.trim();
            const inputUser = document.getElementById('inputUser').value.trim();
            const inputPass = document.getElementById('inputPass').value.trim();
            const feedback = document.getElementById('feedback');

            if (inputUser === refUser && inputPass === refPass) {
                count++;
                document.getElementById('counter').textContent = count;
                feedback.className = "feedback-message feedback-success";
                feedback.textContent = "¡Excelente! Plana completada correctamente. ✨";

                // Limpiar campos para la siguiente plana
                document.getElementById('inputUser').value = "";
                document.getElementById('inputPass').value = "";
                document.getElementById('inputUser').focus();
            } else {
                feedback.className = "feedback-message feedback-error";
                feedback.textContent = "¡Casi! Revisa tu usuario o contraseña e intenta de nuevo.";
            }
        }

        // Detectar tecla Enter en los campos
        document.getElementById('inputPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validateLogin();
        });
        document.getElementById('inputUser').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('inputPass').focus();
        });
    </script>
</body>
</html>
